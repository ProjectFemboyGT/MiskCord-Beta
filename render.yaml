services:
  - type: web
    name: miskcord
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MISKCORD_OWNER
        value: F3MM
      - key: DATABASE_URL
        sync: false
